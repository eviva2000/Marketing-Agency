[project]
name = "agency"
version = "0.1.0"
description = "Agentic marketing agency built on the OpenAI Agents SDK"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.0.19",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
